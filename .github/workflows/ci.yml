name: CI

on:
  push:
    branches:
      - main
      - 'pr/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Lint
        run: npm --prefix web run lint

      - name: Test
        run: npm --prefix web run test:run

      - name: Build
        run: npm --prefix web run build

      - name: Upload dist for Go job
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist/
          if-no-files-found: error

  go:
    name: Go (test + vet + build)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist/

      - name: Test
        run: |
          go test -v -timeout 2m ./... > test.log 2>&1 || {
            STATUS=$?
            echo "::error title=Go Test Failed::exit code $STATUS"
            tail -n 50 test.log | while IFS= read -r line; do
              echo "::warning::$line"
            done
            cat test.log
            exit $STATUS
          }

      - name: Test (race)
        run: |
          go test -v -race -timeout 3m ./... > test_race.log 2>&1 || {
            STATUS=$?
            echo "::error title=Go Race Test Failed::exit code $STATUS"
            tail -n 50 test_race.log | while IFS= read -r line; do
              echo "::warning::$line"
            done
            cat test_race.log
            exit $STATUS
          }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...
