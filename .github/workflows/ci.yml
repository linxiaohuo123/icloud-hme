name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Lint
        run: npm --prefix web run lint

      - name: Test
        run: npm --prefix web run test:run

      - name: Build
        run: npm --prefix web run build

      - name: Upload dist for Go job
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist/
          if-no-files-found: error

  go:
    name: Go (test + vet + build)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist/

      - name: Test
        env:
          ICLOUD_HME_MASTER_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
        run: |
          go test -p 1 -v -timeout 8m ./... > test.log 2>&1 || {
            STATUS=$?
            echo "::error title=Go Test Failed::exit code $STATUS"
            echo "=== FAILED TESTS ==="
            grep -E "--- FAIL|FAIL:" test.log | while IFS= read -r line; do
              echo "::error title=TestFailure::$line"
            done || true
            echo "=== PANIC LOGS ==="
            grep -E "panic:" test.log || true
            echo "=== LAST 50 LINES ==="
            tail -n 50 test.log
            exit $STATUS
          }

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

      - name: Test (race)
        env:
          ICLOUD_HME_MASTER_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
        run: |
          go test -p 1 -v -race -timeout 8m ./... > test_race.log 2>&1 || {
            STATUS=$?
            echo "::error title=Go Race Test Failed::exit code $STATUS"
            echo "=== FAILED RACE TESTS ==="
            grep -E "--- FAIL|FAIL:" test_race.log | while IFS= read -r line; do
              echo "::error title=RaceTestFailure::$line"
            done || true
            echo "=== LAST 50 LINES ==="
            tail -n 50 test_race.log
            exit $STATUS
          }

      - name: Upload Race Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-race-log
          path: test_race.log

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  container-smoke:
    name: Container Smoke (Non-root + Healthcheck)
    runs-on: ubuntu-latest
    needs: [web, go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist/

      - name: Build Docker Image
        run: docker build -t icloud-hme:smoke .

      - name: Verify Missing Master Key Fails Closed
        run: |
          mkdir -p /tmp/smoke-data-nokey
          sudo chown -R 10001:10001 /tmp/smoke-data-nokey
          docker run --name smoke-app-nokey \
            -v /tmp/smoke-data-nokey:/app/data \
            -e ICLOUD_HME_ADMIN_PASSWORD=smoke_test_admin_password_2026 \
            icloud-hme:smoke || true
          EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' smoke-app-nokey)
          echo "Exit code without Master Key: $EXIT_CODE"
          [ "$EXIT_CODE" != "0" ] || { echo "Container should fail closed when Master Key is missing"; exit 1; }
          docker rm -f smoke-app-nokey || true

      - name: Run Smoke Container (Non-root UID 10001, Isolated Empty Data Dir)
        run: |
          mkdir -p /tmp/smoke-data
          sudo chown -R 10001:10001 /tmp/smoke-data
          docker run -d --name smoke-app \
            -p 127.0.0.1:8081:8081 \
            -v /tmp/smoke-data:/app/data \
            -e ICLOUD_HME_ADMIN_PASSWORD=smoke_test_admin_password_2026 \
            -e ICLOUD_HME_MASTER_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE= \
            icloud-hme:smoke
          sleep 3

      - name: Verify Loopback Port Binding
        run: |
          PORT_BINDING=$(docker port smoke-app 8081)
          echo "Port binding: $PORT_BINDING"
          echo "$PORT_BINDING" | grep -q "127.0.0.1"

      - name: Run Smoke Health Script
        run: |
          chmod +x scripts/smoke_health.sh
          bash ./scripts/smoke_health.sh http://127.0.0.1:8081

      - name: Verify Docker Container Healthcheck
        run: |
          sleep 12
          STATUS=$(docker inspect --format='{{.State.Health.Status}}' smoke-app)
          echo "Docker Health Status: $STATUS"
          [ "$STATUS" = "healthy" ] || { echo "Container is not healthy: $STATUS"; exit 1; }

      - name: Cleanup
        if: always()
        run: docker rm -f smoke-app || true

