# [INPUT]: 客户端 HTTPS 请求，反代至本机 127.0.0.1:8081 的 icloud-hme 服务
# [OUTPUT]: 提供经过 TLS 终止、安全头注入、长轮询防超时与静态资源长效缓存的高可用反向代理
# [POS]: deploy/ 的反向代理标准配置范本，关键在于 proxy_read_timeout 130s，杜绝 120s 验证码长轮询 504 假性超时
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

upstream icloud_hme_backend {
    server 127.0.0.1:8081;
    keepalive 32;
}

# 80 端口自动重定向至 HTTPS (保留 ACME 自动化证书续签通道)
server {
    listen 80;
    listen [::]:80;
    server_name hme.your-domain.com;

    # Let's Encrypt / Certbot 自动化证书续签放行
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # 兼容现代 Nginx (>= 1.25): 废弃 listen 参数中的 http2，改用 http2 指令
    http2 on;
    server_name hme.your-domain.com;

    # SSL 证书配置 (请替换为真实证书路径)
    ssl_certificate /etc/letsencrypt/live/hme.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hme.your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 客户端请求体上限 (与 Go 服务端 1MB 限制对齐)
    client_max_body_size 1m;

    # 全局代理基础参数 (统一 130s 超时，彻底覆盖 120s 验证码长轮询与所有长请求)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 10s;
    proxy_read_timeout 130s;

    # ── 核心防护：验证码长轮询接口专属直通 ───────────────────────────────────
    # 关闭 proxy_buffering 确保新邮件到达时 EventBus 能第一时间流式冲刷到客户端
    location = /api/verify/code {
        proxy_pass http://icloud_hme_backend;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── 前端带 Hash 静态资源长期缓存 ──────────────────────────────────────────
    location /assets/ {
        proxy_pass http://icloud_hme_backend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 默认全量路由与 SPA 回退 ───────────────────────────────────────────────
    location / {
        proxy_pass http://icloud_hme_backend;
    }
}
